<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>about-hero ambient loop</title>
  </head>
  <body>
    <style>
      
  * { box-sizing:border-box; }
  html, body { width:1920px; height:1080px; margin:0; overflow:hidden; background:#0A1240; }
  #root { position:relative; width:100%; height:100%; overflow:hidden; isolation:isolate; background:#0A1240; }
  .clip { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; }

      
      .about-hero-ambient-glow { position:absolute; width:38%; height:54%; border-radius:50%; filter:blur(110px); opacity:.46; }
      .about-hero-glow-wine { left:16%; top:25%; background:radial-gradient(ellipse,rgba(194,30,86,.62),transparent 68%); }
      .about-hero-glow-blue { right:12%; bottom:2%; background:radial-gradient(ellipse,rgba(47,91,255,.46),transparent 70%); }
      .about-hero-orbit { position:absolute; left:50%; top:50%; border:1px solid rgba(233,238,255,.17); border-radius:50%; }
      .about-hero-orbit-outer { width:590px; height:590px; margin:-295px 0 0 -295px; }
      .about-hero-orbit-middle { width:430px; height:430px; margin:-215px 0 0 -215px; border-color:rgba(233,238,255,.12); }
      .about-hero-orbit-inner { width:270px; height:270px; margin:-135px 0 0 -135px; border-color:rgba(255,77,141,.2); }
      .about-hero-orbit::after { position:absolute; inset:14%; content:""; border:1px solid rgba(47,91,255,.12); border-radius:50%; }
      .about-hero-orbit-light { position:absolute; top:-8px; left:50%; width:15px; height:15px; margin-left:-7px; border-radius:50%; }
      .about-hero-light-wine { background:#FF4D8D; box-shadow:0 0 22px 7px rgba(255,77,141,.54); }
      .about-hero-light-blue { top:auto; bottom:-6px; width:12px; height:12px; margin-left:-6px; background:#2F5BFF; box-shadow:0 0 22px 7px rgba(47,91,255,.62); }
      .about-hero-light-white { top:50%; left:auto; right:-5px; width:9px; height:9px; margin:0; background:#fff; box-shadow:0 0 17px 5px rgba(233,238,255,.56); }
      .about-hero-center-light { position:absolute; left:50%; top:50%; width:110px; height:110px; margin:-55px 0 0 -55px; border:1px solid rgba(233,238,255,.18); border-radius:50%; background:radial-gradient(circle,rgba(255,77,141,.2),rgba(10,18,64,.08) 68%); box-shadow:0 0 80px rgba(47,91,255,.15); }
    </style>
    <div id="root" data-composition-id="about-hero" data-width="1920" data-height="1080" data-duration="6" data-fps="30">
      <div id="about-hero-layer" class="clip" data-start="0" data-duration="6" data-track-index="1">
        
      <div class="about-hero-ambient-glow about-hero-glow-wine"></div>
      <div class="about-hero-ambient-glow about-hero-glow-blue"></div>
      <div class="about-hero-orbit about-hero-orbit-outer"><i class="about-hero-orbit-light about-hero-light-wine"></i></div>
      <div class="about-hero-orbit about-hero-orbit-middle"><i class="about-hero-orbit-light about-hero-light-blue"></i></div>
      <div class="about-hero-orbit about-hero-orbit-inner"><i class="about-hero-orbit-light about-hero-light-white"></i></div>
      <div class="about-hero-center-light"></div>
      </div>
    </div>
    <script>
      const HALF = 2.9833333333333334;
      const CYCLE = 5.966666666666667;
      const tl = gsap.timeline({ paused: true });
      
      tl.to(".about-hero-orbit-outer",{rotation:360,duration:CYCLE,ease:"none"},0);
      tl.to(".about-hero-orbit-middle",{rotation:-360,duration:CYCLE,ease:"none"},0);
      tl.to(".about-hero-orbit-inner",{rotation:360,duration:CYCLE,ease:"none"},0);
      tl.to(".about-hero-glow-wine",{x:30,y:-18,opacity:0.62,duration:HALF,ease:"sine.inOut",yoyo:true,repeat:1},0);
      tl.to(".about-hero-glow-blue",{x:-28,y:20,opacity:0.4,duration:HALF,ease:"sine.inOut",yoyo:true,repeat:1},0);
      tl.to(".about-hero-center-light",{scale:1.12,opacity:0.72,duration:HALF,ease:"sine.inOut",yoyo:true,repeat:1},0);
      window.__timelines["about-hero"] = tl;
    </script>
  </body>
</html>
